[project]
name = "outcome-bias"
version = "0.1.0"
description = "Outcome bias in LLM auditors: does how things turned out change how the same agent behaviour is judged?"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai",
    "anthropic",
    "openai",
    "matplotlib>=3.10.9",
    "pyyaml",
    "statsmodels>=0.15.0",
    "pandas>=2.3.3",
    "google-genai>=2.33.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["outcome_bias*"]

[tool.setuptools.package-data]
"outcome_bias.stimuli" = ["**/*.yaml", "**/*.txt", "hashes.json", "README.md"]
"outcome_bias.analysis" = ["scenario_codes.yaml"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # macOS can hide the editable install's .pth file (see README)

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["archive", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # rows of the data tables (models, tests, contrasts) read better unwrapped
